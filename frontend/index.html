<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TRTC Latency Test</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e8;
        --ink: #17201b;
        --muted: #66736b;
        --line: #d8d0c2;
        --accent: #0b6b4f;
        --accent-ink: #ffffff;
        --panel: #fffaf0;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 10%, rgba(11, 107, 79, 0.16), transparent 28rem),
          linear-gradient(135deg, #f8f4ea, var(--bg));
        color: var(--ink);
        font: 16px/1.45 Georgia, "Times New Roman", serif;
      }

      main {
        width: min(92vw, 560px);
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(255, 250, 240, 0.92);
        box-shadow: 0 24px 80px rgba(41, 34, 20, 0.12);
      }

      h1 { margin: 0 0 8px; font-size: clamp(32px, 6vw, 52px); line-height: 0.95; }
      p { margin: 0 0 24px; color: var(--muted); }
      label { display: block; margin: 18px 0 8px; font-weight: 700; }
      input, select, button {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid var(--line);
        padding: 10px 12px;
        background: white;
        color: var(--ink);
        font: 16px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      button {
        margin-top: 24px;
        border: 0;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
        font-weight: 800;
      }
      button:disabled { opacity: 0.62; cursor: wait; }
      #status { min-height: 24px; margin-top: 16px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Latency Test</h1>
      <p>Join as anchor or audience. The app keeps runtime work intentionally small so the test tool does not become the test problem.</p>

      <form id="join-form">
        <label for="room-id">Room ID</label>
        <input id="room-id" name="roomId" inputmode="numeric" pattern="[0-9]+" value="1001" required>

        <label for="user-id">User ID</label>
        <input id="user-id" name="userId" autocomplete="off" required>

        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="anchor">Anchor</option>
          <option value="audience">Audience</option>
        </select>

        <button id="join-button" type="submit">Join Room</button>
      </form>
      <div id="status" role="status"></div>
    </main>

    <script>
      const form = document.getElementById('join-form');
      const button = document.getElementById('join-button');
      const statusEl = document.getElementById('status');
      const userIdEl = document.getElementById('user-id');
      const roleEl = document.getElementById('role');
      const suffix = (() => {
        const bytes = new Uint8Array(2);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
      })();

      function defaultUserId(role) {
        return `${role === 'anchor' ? 'anchor' : 'viewer'}_${suffix}`;
      }

      userIdEl.value = defaultUserId(roleEl.value);
      roleEl.addEventListener('change', () => {
        if (/^(anchor|viewer|audience)_[0-9a-f]{4}$/.test(userIdEl.value)) {
          userIdEl.value = defaultUserId(roleEl.value);
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const roomId = form.roomId.value.trim();
        const userId = form.userId.value.trim();
        const role = form.role.value;

        if (!/^[A-Za-z0-9_-]+$/.test(userId)) {
          statusEl.textContent = 'User ID can only contain letters, numbers, underscores, and hyphens.';
          return;
        }

        button.disabled = true;
        statusEl.textContent = 'Requesting UserSig...';

        try {
          const response = await fetch('/api/usersig', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId })
          });
          if (!response.ok) {
            throw new Error(await response.text());
          }
          const { sdkAppId, userSig } = await response.json();
          sessionStorage.setItem('trtcJoinConfig', JSON.stringify({ sdkAppId, userSig, roomId, userId, role }));
          location.href = `/room.html?role=${encodeURIComponent(role)}&roomId=${encodeURIComponent(roomId)}&userId=${encodeURIComponent(userId)}`;
        } catch (error) {
          statusEl.textContent = `Join failed: ${error.message || error}`;
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
