<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TRTC Room</title>
    <style>
      :root {
        --bg: #111713;
        --panel: #18211c;
        --ink: #f6f1e7;
        --muted: #b6c0b9;
        --line: #334238;
        --good: #f2c14e;
        --danger: #d95d39;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 80% 0%, rgba(242, 193, 78, 0.12), transparent 32rem),
          linear-gradient(135deg, #0d120f, var(--bg));
        color: var(--ink);
        font: 15px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(24, 33, 28, 0.88);
      }
      h1 { margin: 0; font: 700 20px/1 Georgia, "Times New Roman", serif; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        background: var(--danger);
        color: white;
        cursor: pointer;
        font-weight: 800;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        padding: 16px;
      }
      .stage, .panel {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(24, 33, 28, 0.78);
        overflow: hidden;
      }
      .stage {
        min-height: min(72vh, 720px);
        display: grid;
        place-items: center;
      }
      canvas, video {
        width: 100%;
        max-height: 78vh;
        object-fit: contain;
        background: #050705;
      }
      #remote-video {
        width: 100%;
        min-height: min(72vh, 720px);
      }
      .panel { padding: 16px; }
      .panel h2 { margin: 0 0 14px; font: 700 18px/1 Georgia, "Times New Roman", serif; }
      .metric {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .metric span:first-child { color: var(--muted); }
      #status { color: var(--good); }
      #event-log {
        max-height: 180px;
        overflow: auto;
        margin: 0;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.18);
        color: var(--muted);
        white-space: pre-wrap;
        font-size: 12px;
      }
      .hidden { display: none; }
      @media (max-width: 900px) {
        main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>TRTC Latency Room</h1>
      <button id="leave-button" type="button">Leave Room</button>
    </header>

    <main>
      <section class="stage">
        <canvas id="anchor-canvas" width="1280" height="720" class="hidden"></canvas>
        <video id="anchor-preview" class="hidden" autoplay muted playsinline></video>
        <div id="remote-video" class="hidden"></div>
      </section>

      <aside class="panel">
        <h2>Session</h2>
        <div class="metric"><span>Status</span><strong id="status">Starting...</strong></div>
        <div class="metric"><span>Role</span><strong id="role"></strong></div>
        <div class="metric"><span>Room</span><strong id="room-id"></strong></div>
        <div class="metric"><span>User</span><strong id="user-id"></strong></div>
        <div class="metric"><span>Session ID</span><strong id="session-id">n/a</strong></div>

        <h2 style="margin-top: 22px;">Latest Stats</h2>
        <div class="metric"><span>P2P delay</span><strong id="p2p-delay">n/a</strong></div>
        <div class="metric"><span>Jitter buffer</span><strong id="jitter-delay">n/a</strong></div>
        <div class="metric"><span>RTT</span><strong id="rtt">n/a</strong></div>
        <div class="metric"><span>Bitrate</span><strong id="bitrate">n/a</strong></div>
        <div class="metric"><span>Frame rate</span><strong id="framerate">n/a</strong></div>
        <div class="metric"><span>Samples logged</span><strong id="sample-count">0</strong></div>

        <h2 style="margin-top: 22px;">Event Log</h2>
        <pre id="event-log">Starting...</pre>
      </aside>
    </main>

    <script src="https://www.unpkg.com/trtc-sdk-v5@latest/trtc.js"></script>
    <script src="/js/ntp-sync.js"></script>
    <script src="/js/anchor.js"></script>
    <script src="/js/viewer.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
